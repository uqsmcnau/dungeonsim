name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  gut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: /opt/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p /opt/godot
          unzip -q /tmp/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /opt/godot/godot
          chmod +x /opt/godot/godot

      - name: Import project (generates .godot/ cache and class_name registry)
        run: /opt/godot/godot --headless --editor --path . --quit

      - name: Run GUT test suite
        run: /opt/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd

  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Lint (settings in .gdlintrc)
        run: gdlint scripts tests tools
